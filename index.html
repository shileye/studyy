<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Sorrow // 算法日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #4f46e5; /* 靛蓝 */
            --accent: #db2777; /* 玫红 */
            --text-main: #334155;
            --text-light: #64748b;
            --shadow: 0 4px 20px -5px rgba(0,0,0,0.1);
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; outline: none; transition: all 0.3s ease; }

        body {
            margin: 0; padding: 40px 20px;
            background: var(--bg); color: var(--text-main);
            font-family: 'Noto Serif SC', serif; /* 主要是衬线体，更有诗意 */
            min-height: 100vh;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 1200px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            grid-template-areas: "quote quote" "sidebar main";
        }

        /* 顶部语录 */
        .quote-box {
            grid-area: quote;
            background: var(--card);
            padding: 50px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            border-left: 5px solid var(--primary);
            overflow: hidden;
        }
        .quote-content {
            font-size: 1.6rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
            min-height: 2.4rem;
        }
        .quote-author {
            color: var(--accent);
            font-style: italic;
            font-size: 0.95rem;
        }
        .timer-bar {
            position: absolute; bottom: 0; left: 0; height: 3px; background: var(--primary);
            width: 0%; animation: timeFlow 30s linear infinite;
        }
        @keyframes timeFlow { from {width: 0%} to {width: 100%} }

        /* 左侧面板 */
        .sidebar { grid-area: sidebar; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: var(--shadow); }

        .user-card { text-align: center; }
        .rank-badge {
            background: #e0e7ff; color: var(--primary);
            padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .xp-bar {
            height: 8px; background: #f1f5f9; border-radius: 4px; margin: 15px 0; overflow: hidden;
        }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item { background: #f8fafc; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .stat-val { font-weight: bold; font-size: 1.2rem; color: var(--text-main); display: block; }

        /* 日历 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .cal-cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; font-size: 0.8rem; background: #f8fafc; color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
        }
        .cal-cell.today { border: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
        .cal-cell.active { background: var(--primary); color: white; }
        .cal-cell.gold { background: var(--gold); color: white; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }

        /* 主内容区 */
        .main { grid-area: main; display: flex; flex-direction: column; gap: 25px; }

        /* 必修任务 */
        .todo-section { border: 2px dashed #cbd5e1; }
        .todo-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px;
        }
        .todo-item.done { text-decoration: line-through; opacity: 0.6; }

        /* 提交区 */
        .input-box {
            display: grid; gap: 15px;
        }
        .row { display: flex; gap: 10px; }
        input, select {
            padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; width: 100%;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn {
            border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer;
            color: white; background: var(--primary);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-share { background: var(--accent); width: 100%; margin-top: 10px; }

        /* 记录列表 */
        .log-list { display: flex; flex-direction: column; gap: 10px; }
        .log-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; background: white; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); border-left: 4px solid #ccc;
        }
        .rating-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            padding: 3px 8px; border-radius: 4px; margin-right: 8px; color: white;
        }

        /* 响应式 */
        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; grid-template-areas: "quote" "sidebar" "main"; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 语录区 (自动刷新) -->
    <div class="quote-box">
        <div class="quote-content" id="qContent">...</div>
        <div class="quote-author" id="qAuthor"></div>
        <div class="timer-bar"></div>
    </div>

    <!-- 2. 左侧状态 -->
    <div class="sidebar">
        <div class="card user-card">
            <h2 style="margin:5px 0" id="username">Algo_Warrior</h2>
            <div class="rank-badge" id="lvTitle">Unrated</div>
            
            <div style="display:flex; justify-content:space-between; margin-top:15px; font-size:0.8rem;">
                <span>LV.<span id="lvNum">1</span></span>
                <span><span id="curXP">0</span> / <span id="nextXP">100</span> XP</span>
            </div>
            <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>

            <div class="stat-grid">
                <div class="stat-item"><span class="stat-val" id="totalAC">0</span>累计AC</div>
                <div class="stat-item"><span class="stat-val" id="maxRating">0</span>最高Rating</div>
                <div class="stat-item" style="grid-column: span 2;">
                    <span class="stat-val" id="streakDays" style="color:var(--accent)">0</span>
                    连续打卡天数
                </div>
            </div>

            <button class="btn btn-share" onclick="copyReport()">📋 复制今日战报 (发群)</button>
        </div>

        <div class="card">
            <div style="font-weight:bold; margin-bottom:10px;" id="calTitle"></div>
            <div class="calendar-grid" id="calGrid"></div>
        </div>
    </div>

    <!-- 3. 主操作区 -->
    <div class="main">
        
        <!-- 必修任务 -->
        <div class="card todo-section">
            <h3 style="margin:0 0 15px 0; color:var(--primary);">📜 每日必修 (Daily Quest)</h3>
            <div class="row">
                <input type="text" id="todoInput" placeholder="输入今天的必做题 (e.g. 羊题 LC 1024)">
                <button class="btn" style="width:auto;" onclick="addTodo()">添加</button>
            </div>
            <div style="margin-top:15px;" id="todoList"></div>
        </div>

        <!-- 提交 AC -->
        <div class="card input-box" id="submitZone">
            <h3 style="margin:0;">⚔️ 提交代码 (Commit)</h3>
            
            <div class="row">
                <select id="ratingSelect" style="flex:1;">
                    <option value="1200">Rating < 1400 (新手/简单)</option>
                    <option value="1500">1400 ~ 1600 (普及/中等)</option>
                    <option value="1750">1600 ~ 1900 (提高/困难)</option>
                    <option value="2000">1900 ~ 2100 (大师/竞赛)</option>
                    <option value="2200">Rating 2100+ (传奇/地狱)</option>
                </select>
                <input type="text" id="probName" placeholder="题目名称" style="flex:2;">
            </div>

            <div class="row">
                <input type="text" id="probLink" placeholder="题目链接 (选填)">
                <input type="text" id="solLink" placeholder="题解链接 (选填)">
            </div>

            <button class="btn" onclick="submitAC()">✅ 确认 AC (GET XP)</button>
        </div>

        <!-- 历史记录 -->
        <h3 style="margin:0;">🗓️ 时光轨迹</h3>
        <div class="log-list" id="logList"></div>
    </div>
</div>

<script>
    /* --- 配置区 --- */
    const DB_KEY = "algo_v4_rating";
    
    // 语录库 (40条)
    const QUOTES = [
        // 古诗词
        {t:"十年生死两茫茫，不思量，自难忘。", a:"苏轼"},
        {t:"欲买桂花同载酒，终不似，少年游。", a:"刘过"},
        {t:"人生若只如初见，何事秋风悲画扇。", a:"纳兰性德"},
        {t:"曾经沧海难为水，除却巫山不是云。", a:"元稹"},
        {t:"此情可待成追忆，只是当时已惘然。", a:"李商隐"},
        {t:"桃李春风一杯酒，江湖夜雨十年灯。", a:"黄庭坚"},
        {t:"满目山河空念远，落花风雨更伤春。", a:"晏殊"},
        {t:"醉后不知天在水，满船清梦压星河。", a:"唐温如"},
        {t:"世间无限丹青手，一片伤心画不成。", a:"高蟾"},
        {t:"休对故人思故国，且将新火试新茶。诗酒趁年华。", a:"苏轼"},
        // 伤感/孤独
        {t:"代码写得再好，也 catch 不到你抛出的异常。", a:"Anon"},
        {t:"我们都在阴沟里，但仍有人仰望星空。", a:"王尔德"},
        {t:"你所谓的岁月静好，不过是有人替你负重前行。", a:"网络"},
        {t:"后来，我们什么都有了，却没有了我们。", a:"后来的我们"},
        {t:"听闻爱情，十人九悲。", a:"网抑云"},
        {t:"孤独是人生的常态，算法是孤独的解药。", a:"Coder"},
        {t:"不仅要 AC 题目，更想 AC 你的人生。", a:"情书"},
        {t:"凌晨三点的 IDE，比任何人都懂你的努力。", a:"致自己"},
        // 励志/Rating
        {t:"种一棵树最好的时间是十年前，其次是现在。", a:"Dambisa Moyo"},
        {t:"简单的事情重复做，你就是专家。", a:"刻意练习"},
        {t:"不要在夕阳西下时幻想，要在旭日东升时努力。", a:"早安"},
        {t:"你想要的生活，都在你现在的努力里。", a:"加油"},
        {t:"菜是原罪，练是救赎。", a:"小羊肖恩(大概说过)"},
        {t:"Rating 2000 以前，没有天赋，只有手熟。", a:"算法竞赛"},
        {t:"那些杀不死你的 Bug，终将使你更强大。", a:"Nietzsche Patch"},
        {t:"既然选择了远方，便只顾风雨兼程。", a:"汪国真"},
        {t:"星光不问赶路人，时光不负有心人。", a:"佚名"},
        {t:"将来的你，一定会感谢现在拼命的自己。", a:"共勉"},
        {t:"乾坤未定，你我皆是黑马。", a:"高考标语"},
        {t:"Talk is cheap. Show me the code.", a:"Linus Torvalds"},
        // 补充
        {t:"人生如逆旅，我亦是行人。", a:"苏轼"},
        {t:"当时只道是寻常。", a:"纳兰性德"},
        {t:"知我者，谓我心忧；不知我者，谓我何求。", a:"诗经"},
        {t:"每一个不曾起舞的日子，都是对生命的辜负。", a:"尼采"},
        {t:"愿你出走半生，归来仍是少年。", a:"孙衍"},
        {t:"未雨绸缪，是程序员的顶级浪漫。", a:"架构"},
        {t:"真正的大师，永远怀着一颗学徒的心。", a:"易大师"},
        {t:"你只管努力，上天自有安排。", a:"随缘"},
        {t:"Debug 的过程，就是自己承认自己傻逼的过程。", a:"真理"},
        {t:"为了看一眼山顶的风景，我愿意流干汗水。", a:"攀登者"}
    ];

    // Rating 颜色配置
    const RATINGS = {
        "1200": { color: "#808080", label: "< 1400", xp: 10 },    // 灰
        "1500": { color: "#03a89e", label: "1400-1600", xp: 25 }, // 青
        "1750": { color: "#3b82f6", label: "1600-1900", xp: 45 }, // 蓝
        "2000": { color: "#a855f7", label: "1900-2100", xp: 70 }, // 紫
        "2200": { color: "#ef4444", label: "2100+", xp: 100 }     // 红
    };

    let appData = {
        xp: 0,
        level: 1,
        maxRating: 0,
        todos: [],
        logs: []
    };

    let quoteIdx = 0;

    /* --- 初始化 --- */
    window.onload = () => {
        loadData();
        renderUI();
        
        // 启动语录轮播 (30s)
        updateQuote();
        setInterval(() => {
            quoteIdx = (quoteIdx + 1) % QUOTES.length;
            updateQuote();
        }, 30000);
    };

    function updateQuote() {
        const q = QUOTES[quoteIdx];
        const elC = document.getElementById('qContent');
        const elA = document.getElementById('qAuthor');
        
        // 淡出动画
        elC.style.opacity = 0; elA.style.opacity = 0;
        
        setTimeout(() => {
            elC.innerText = q.t;
            elA.innerText = `—— ${q.a}`;
            elC.style.opacity = 1; elA.style.opacity = 1;
        }, 300);
    }

    /* --- 核心逻辑 --- */
    function loadData() {
        const saved = localStorage.getItem(DB_KEY);
        if (saved) appData = JSON.parse(saved);
        // 确保日期是今天
        const today = new Date().toISOString().split('T')[0];
    }

    function saveData() {
        localStorage.setItem(DB_KEY, JSON.stringify(appData));
        renderUI();
    }

    // 1. 添加必修任务
    function addTodo() {
        const val = document.getElementById('todoInput').value;
        if (!val) return;
        appData.todos.push({
            id: Date.now(),
            text: val,
            date: new Date().toISOString().split('T')[0],
            done: false
        });
        document.getElementById('todoInput').value = '';
        saveData();
    }

    // 2. 提交 AC
    let pendingTodoId = null;

    function setPendingTodo(id, text) {
        pendingTodoId = id;
        document.getElementById('probName').value = text;
        document.getElementById('submitZone').scrollIntoView({ behavior: 'smooth' });
        document.getElementById('probName').focus();
    }

    function submitAC() {
        const name = document.getElementById('probName').value;
        if (!name) return alert("题目名字都不写？");

        const rVal = document.getElementById('ratingSelect').value;
        const config = RATINGS[rVal];
        
        // 更新最大Rating
        const rNum = parseInt(rVal); // 简单用value代表分数段基准
        if (rVal === "2200") appData.maxRating = Math.max(appData.maxRating, 2200);
        else if (rVal === "2000") appData.maxRating = Math.max(appData.maxRating, 2000);
        // ...简化处理，主要看 XP

        // 联动必修任务
        if (pendingTodoId) {
            const task = appData.todos.find(t => t.id === pendingTodoId);
            if (task) task.done = true;
            pendingTodoId = null;
        } else {
            // 尝试按名字匹配
            const match = appData.todos.find(t => t.text === name && !t.done);
            if (match) match.done = true;
        }

        // 记录日志
        appData.logs.unshift({
            id: Date.now(),
            date: new Date().toISOString(),
            name: name,
            ratingVal: rVal,
            link: document.getElementById('probLink').value,
            sol: document.getElementById('solLink').value,
            xp: config.xp
        });

        appData.xp += config.xp;
        
        // 升级判定 (XP曲线: 50 * level^2)
        const nextLv = Math.floor(Math.sqrt(appData.xp / 50)) + 1;
        if (nextLv > appData.level) {
            appData.level = nextLv;
            alert(`🎉 恭喜升级！当前等级 LV.${appData.level}`);
        }

        // 清空
        document.getElementById('probName').value = '';
        document.getElementById('probLink').value = '';
        document.getElementById('solLink').value = '';
        
        saveData();
    }

    // 3. 复制战报 (替代公开链接方案)
    function copyReport() {
        const today = new Date().toISOString().split('T')[0];
        const todayLogs = appData.logs.filter(l => l.date.startsWith(today));
        const totalXP = todayLogs.reduce((sum, l) => sum + l.xp, 0);
        
        const text = `
📅 算法修炼日报 [${today}]
👤 ID: Algo_Warrior (Lv.${appData.level})
🏆 今日Rating: ${appData.maxRating > 0 ? appData.maxRating : '暂无'}
⚔️ 今日刷题: ${todayLogs.length} 道
✨ 获得经验: ${totalXP} XP
--------------------
${todayLogs.map(l => `✅ [${RATINGS[l.ratingVal].label}] ${l.name}`).join('\n')}
--------------------
"${document.getElementById('qContent').innerText}"
(Powered by Code & Sorrow)
        `.trim();

        navigator.clipboard.writeText(text).then(() => {
            alert("战报已复制！快去群里粘贴装逼！");
        });
    }

    /* --- 渲染逻辑 --- */
    function renderUI() {
        // 用户面板
        document.getElementById('lvNum').innerText = appData.level;
        document.getElementById('curXP').innerText = appData.xp;
        const nextXP = 50 * Math.pow(appData.level, 2);
        document.getElementById('nextXP').innerText = nextXP;
        const prevXP = 50 * Math.pow(appData.level - 1, 2);
        const pct = ((appData.xp - prevXP) / (nextXP - prevXP)) * 100;
        document.getElementById('xpFill').style.width = `${Math.max(0, Math.min(pct, 100))}%`;

        document.getElementById('totalAC').innerText = appData.logs.length;
        // 简易计算最大Rating显示 (根据日志里的最高记录)
        let maxR = 0;
        appData.logs.forEach(l => {
            if(l.ratingVal === '2200') maxR = Math.max(maxR, 2100);
            else if(l.ratingVal === '2000') maxR = Math.max(maxR, 1900);
            else if(l.ratingVal === '1750') maxR = Math.max(maxR, 1600);
            else if(l.ratingVal === '1500') maxR = Math.max(maxR, 1400);
            else maxR = Math.max(maxR, 1200);
        });
        document.getElementById('maxRating').innerText = maxR > 0 ? maxR + '+' : 'Unrated';

        // 必修列表
        const todoBox = document.getElementById('todoList');
        todoBox.innerHTML = '';
        // 仅显示未完成 或者 今天完成的
        const today = new Date().toISOString().split('T')[0];
        const showTodos = appData.todos.filter(t => !t.done || t.date === today);
        
        if (showTodos.length === 0) todoBox.innerHTML = '<div style="color:#999;font-size:0.9rem">今日无任务，快去添加！</div>';

        showTodos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.done ? 'done' : ''}`;
            div.innerHTML = `
                <span>${t.text}</span>
                ${!t.done ? `<button class="btn btn-outline" style="padding:4px 10px;font-size:0.8rem" onclick="setPendingTodo(${t.id}, '${t.text}')">去完成</button>` : '<span>✔️</span>'}
            `;
            todoBox.appendChild(div);
        });

        // 日志列表
        const logBox = document.getElementById('logList');
        logBox.innerHTML = '';
        appData.logs.slice(0, 30).forEach(l => {
            const conf = RATINGS[l.ratingVal];
            const div = document.createElement('div');
            div.className = 'log-card';
            div.style.borderLeftColor = conf.color;
            div.innerHTML = `
                <div>
                    <div style="font-weight:bold;">
                        <span class="rating-tag" style="background:${conf.color}">${conf.label}</span>
                        ${l.name}
                    </div>
                    <div style="font-size:0.8rem; color:#888; margin-top:5px;">
                        ${l.date.split('T')[0]} · +${l.xp} XP
                    </div>
                </div>
                <div>
                    ${l.link ? `<a href="${l.link}" target="_blank" style="color:var(--primary)">题目</a>` : ''}
                </div>
            `;
            logBox.appendChild(div);
        });

        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth();
        document.getElementById('calTitle').innerText = `${y}年 ${m+1}月`;
        
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m+1, 0).getDate();
        
        // 统计数据
        const stats = {};
        appData.logs.forEach(l => {
            const d = l.date.split('T')[0];
            stats[d] = 'active';
        });

        // 检查金色 (当天必修全部完成)
        // 简单逻辑：如果当天有Todo且全部done，则gold。这里简化为只要做了难题(Rating>1900)就给金
        appData.logs.forEach(l => {
            if (parseInt(l.ratingVal) >= 2000) {
                const d = l.date.split('T')[0];
                stats[d] = 'gold';
            }
        });
        
        // 渲染
        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
        
        let streak = 0;
        const todayStr = now.toISOString().split('T')[0];

        for(let d=1; d<=daysInMonth; d++) {
            const dayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.className = `cal-cell ${stats[dayStr] || ''}`;
            if (dayStr === todayStr) cell.classList.add('today');
            cell.innerText = d;
            grid.appendChild(cell);

            // 简单计算连胜：检查直到昨天的连续记录
            if (new Date(dayStr) <= now && stats[dayStr]) streak++;
            else if (new Date(dayStr) < now && !stats[dayStr]) streak = 0;
        }
        document.getElementById('streakDays').innerText = streak;
    }
</script>
</body>
</html>
