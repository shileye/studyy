<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Sorrow // 算法日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #4f46e5;
            --accent: #db2777;
            --text-main: #334155;
            --text-light: #64748b;
            --shadow: 0 4px 20px -5px rgba(0,0,0,0.1);
            --gold: #f59e0b;
        }

        * { box-sizing: border-box; outline: none; transition: all 0.3s ease; }

        body {
            margin: 0; padding: 40px 20px;
            background: var(--bg); color: var(--text-main);
            font-family: 'Noto Serif SC', serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 1200px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 25px;
            grid-template-areas: "quote quote" "sidebar main";
        }

        /* 顶部语录 */
        .quote-box {
            grid-area: quote;
            background: var(--card);
            padding: 35px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            border-left: 5px solid var(--primary);
            overflow: hidden;
        }
        .quote-content {
            font-size: 1.4rem; font-weight: bold; color: #1e293b;
            margin-bottom: 10px; min-height: 2rem;
        }
        .quote-author { color: var(--accent); font-style: italic; font-size: 0.9rem; }
        .timer-bar {
            position: absolute; bottom: 0; left: 0; height: 3px; background: var(--primary);
            width: 0%; animation: timeFlow 30s linear infinite;
        }
        @keyframes timeFlow { from {width: 0%} to {width: 100%} }

        /* 左侧面板 */
        .sidebar { grid-area: sidebar; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }

        .user-header { text-align: center; margin-bottom: 15px; }
        .rank-badge {
            background: #e0e7ff; color: var(--primary);
            padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* 经验条 */
        .xp-container { margin: 10px 0; }
        .xp-info { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        .xp-bar { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; }

        /* 快捷链接传送门 */
        .quick-links {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;
        }
        .q-link {
            text-decoration: none; background: #f1f5f9; color: var(--text-main);
            padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85rem;
            font-weight: bold; font-family: sans-serif; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .q-link:hover { background: #e2e8f0; color: var(--primary); transform: translateY(-2px); }
        .q-link.blog { background: #ffe4e6; color: #be123c; } /* 博客园粉 */

        /* 分段统计 */
        .rating-stats { margin-top: 20px; border-top: 1px dashed #e2e8f0; padding-top: 15px; }
        .rs-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace;}
        .rs-label { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* 按钮组 */
        .btn-group { display: grid; gap: 8px; margin-top: 15px; }
        .btn-share { 
            background: var(--text-main); color: white; border: none; padding: 10px; 
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
        }
        .btn-ai {
            background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 10px;
            border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold;
        }
        .btn-share:hover, .btn-ai:hover { opacity: 0.9; transform: scale(0.98); }

        /* 日历 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; font-size: 0.75rem; background: #f8fafc; color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
        }
        .cal-cell.today { border: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
        .cal-cell.active { background: var(--primary); color: white; }
        .cal-cell.gold { background: var(--gold); color: white; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }

        /* 主内容 */
        .main { grid-area: main; display: flex; flex-direction: column; gap: 20px; }
        
        /* 必修任务 */
        .todo-section { border: 2px dashed #cbd5e1; }
        .todo-list { margin-top: 15px; }
        .todo-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px;
        }
        .todo-item.done { text-decoration: line-through; opacity: 0.6; }

        /* 提交区 */
        .input-box { display: grid; gap: 12px; }
        .row { display: flex; gap: 10px; }
        input, select {
            padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; width: 100%;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .btn-submit {
            border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
            color: white; background: var(--primary); transition: 0.2s;
        }

        /* 历史记录 */
        .log-list { display: flex; flex-direction: column; gap: 10px; }
        .log-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: white; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); border-left: 4px solid #ccc;
        }
        .rating-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 4px; margin-right: 8px; color: white;
        }
        .link-group a {
            text-decoration: none; font-size: 0.85rem; margin-left: 15px;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .link-prob { color: #94a3b8; } .link-prob:hover { color: var(--text-main); text-decoration: underline; }
        .link-sol { color: var(--primary); font-weight: bold; } .link-sol:hover { text-decoration: underline; }

        /* 底部 */
        .footer-msg {
            margin: 40px 0 20px 0; text-align: center; color: #94a3b8;
            font-size: 0.9rem; letter-spacing: 1px; font-family: 'Noto Serif SC', serif;
            grid-column: 1 / -1;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; grid-template-areas: "quote" "sidebar" "main"; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 语录区 -->
    <div class="quote-box">
        <div class="quote-content" id="qContent">...</div>
        <div class="quote-author" id="qAuthor"></div>
        <div class="timer-bar"></div>
    </div>

    <!-- 2. 左侧状态 -->
    <div class="sidebar">
        <div class="card">
            <div class="user-header">
                <h2 style="margin:5px 0" id="username">Algo_Warrior</h2>
                <div class="rank-badge" id="lvTitle">Unrated</div>
            </div>
            
            <div class="xp-container">
                <div class="xp-info">
                    <span>LV.<span id="lvNum">1</span></span>
                    <span><span id="curXP">0</span> / <span id="nextXP">100</span> XP</span>
                </div>
                <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
            </div>

            <div style="text-align:center; margin-top:15px; font-size:0.9rem;">
                <span style="margin-right:15px;">🏆 AC: <b id="totalAC">0</b></span>
                <span>🔥 连打: <b id="streakDays" style="color:var(--accent)">0</b></span>
            </div>

            <!-- 分段统计 (新功能) -->
            <div class="rating-stats" id="ratingStatsBox">
                <!-- JS 填充 -->
            </div>

            <!-- 传送门 (新功能) -->
            <div class="quick-links">
                <a href="https://i.cnblogs.com/posts/edit" target="_blank" class="q-link blog">📝 写博客</a>
                <a href="https://codeforces.com/" target="_blank" class="q-link">📊 CF</a>
                <a href="https://ac.nowcoder.com/acm/contest/vip-index" target="_blank" class="q-link">🐂 牛客</a>
                <a href="https://atcoder.jp/" target="_blank" class="q-link">🇯🇵 ABC</a>
            </div>

            <div class="btn-group">
                <button class="btn-ai" onclick="generateAIPrompt()">🤖 复制 AI 复盘提示词</button>
                <button class="btn-share" onclick="copyReport()">📋 复制极简战报</button>
            </div>
        </div>

        <div class="card">
            <div style="font-weight:bold; margin-bottom:10px;" id="calTitle"></div>
            <div class="calendar-grid" id="calGrid"></div>
        </div>
    </div>

    <!-- 3. 主操作区 -->
    <div class="main">
        <!-- 必修任务 -->
        <div class="card todo-section">
            <h3 style="margin:0; color:var(--primary);">📜 每日必修 (Daily Quest)</h3>
            <div class="row" style="margin-top:15px;">
                <input type="text" id="todoInput" placeholder="输入任务 (e.g. 补题 CF 1900C)">
                <button class="btn-submit" style="width:auto;" onclick="addTodo()">添加</button>
            </div>
            <div class="todo-list" id="todoList"></div>
        </div>

        <!-- 提交 AC -->
        <div class="card input-box" id="submitZone">
            <h3 style="margin:0;">⚔️ 提交代码 (Commit)</h3>
            <div class="row">
                <select id="ratingSelect" style="flex:1;">
                    <option value="1200">Rating < 1400 (新手)</option>
                    <option value="1500">1400 ~ 1600 (普及)</option>
                    <option value="1750">1600 ~ 1900 (提高)</option>
                    <option value="2000">1900 ~ 2100 (大师)</option>
                    <option value="2200">Rating 2100+ (传奇)</option>
                </select>
                <input type="text" id="probName" placeholder="题目名称" style="flex:2;">
            </div>
            <div class="row">
                <input type="text" id="probLink" placeholder="原题链接">
                <input type="text" id="solLink" placeholder="我的代码/博客链接 (重要)">
            </div>
            <button class="btn-submit" onclick="submitAC()">✅ 确认 AC</button>
        </div>

        <!-- 历史记录 -->
        <h3 style="margin:0;">🗓️ 时光轨迹</h3>
        <div class="log-list" id="logList"></div>
    </div>

    <div class="footer-msg">你要考虑这是不是你此生仅有的机会</div>
</div>

<script>
    const DB_KEY = "algo_v5_pro"; // 升级数据库版本
    
    const QUOTES = [
        {t:"十年生死两茫茫，不思量，自难忘。", a:"苏轼"}, {t:"欲买桂花同载酒，终不似，少年游。", a:"刘过"},
        {t:"人生若只如初见，何事秋风悲画扇。", a:"纳兰性德"}, {t:"代码写得再好，也 catch 不到你抛出的异常。", a:"Anon"},
        {t:"我们都在阴沟里，但仍有人仰望星空。", a:"王尔德"}, {t:"简单的事情重复做，你就是专家。", a:"刻意练习"},
        {t:"你想要的生活，都在你现在的努力里。", a:"加油"}, {t:"菜是原罪，练是救赎。", a:"小羊肖恩"},
        {t:"Talk is cheap. Show me the code.", a:"Linus"}, {t:"人生如逆旅，我亦是行人。", a:"苏轼"},
        {t:"未雨绸缪，是程序员的顶级浪漫。", a:"架构"}, {t:"为了看一眼山顶的风景，我愿意流干汗水。", a:"攀登者"}
    ];

    const RATINGS = {
        "1200": { color: "#9ca3af", label: "< 1400", xp: 10 },
        "1500": { color: "#2dd4bf", label: "1400-1600", xp: 25 },
        "1750": { color: "#3b82f6", label: "1600-1900", xp: 45 },
        "2000": { color: "#a855f7", label: "1900-2100", xp: 70 },
        "2200": { color: "#ef4444", label: "2100+", xp: 100 }
    };

    let appData = { xp: 0, level: 1, maxRating: 0, todos: [], logs: [] };
    let quoteIdx = 0;

    window.onload = () => {
        loadData();
        renderUI();
        updateQuote();
        setInterval(() => { quoteIdx = (quoteIdx + 1) % QUOTES.length; updateQuote(); }, 30000);
    };

    function updateQuote() {
        const q = QUOTES[quoteIdx];
        const elC = document.getElementById('qContent');
        const elA = document.getElementById('qAuthor');
        elC.style.opacity = 0; elA.style.opacity = 0;
        setTimeout(() => {
            elC.innerText = q.t; elA.innerText = `—— ${q.a}`;
            elC.style.opacity = 1; elA.style.opacity = 1;
        }, 300);
    }

    function loadData() {
        const saved = localStorage.getItem(DB_KEY);
        // 尝试从旧版本迁移数据（可选）
        if (saved) {
            appData = JSON.parse(saved);
        } else {
            const old = localStorage.getItem("algo_v4_rating");
            if(old) appData = JSON.parse(old); // 简单迁移
        }
    }
    function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(appData)); renderUI(); }

    function addTodo() {
        const val = document.getElementById('todoInput').value;
        if (!val) return;
        appData.todos.push({ id: Date.now(), text: val, date: new Date().toISOString().split('T')[0], done: false });
        document.getElementById('todoInput').value = '';
        saveData();
    }

    function setPendingTodo(text) {
        document.getElementById('probName').value = text;
        document.getElementById('submitZone').scrollIntoView({ behavior: 'smooth' });
        document.getElementById('probName').focus();
    }

    function submitAC() {
        const name = document.getElementById('probName').value;
        if (!name) return alert("题目名称必填");
        const rVal = document.getElementById('ratingSelect').value;
        const config = RATINGS[rVal];
        const sol = document.getElementById('solLink').value;
        const link = document.getElementById('probLink').value;

        if (rVal === "2200") appData.maxRating = Math.max(appData.maxRating, 2200);
        else if (rVal === "2000") appData.maxRating = Math.max(appData.maxRating, 2000);

        const match = appData.todos.find(t => t.text === name && !t.done);
        if (match) match.done = true;

        appData.logs.unshift({ id: Date.now(), date: new Date().toISOString(), name, ratingVal: rVal, link, sol, xp: config.xp });
        appData.xp += config.xp;
        
        const nextLv = Math.floor(Math.sqrt(appData.xp / 50)) + 1;
        if (nextLv > appData.level) { appData.level = nextLv; alert(`🎉 升级了！LV.${appData.level}`); }

        document.getElementById('probName').value = '';
        document.getElementById('probLink').value = '';
        document.getElementById('solLink').value = '';
        saveData();
    }

    // --- AI 复盘核心逻辑 ---
    function generateAIPrompt() {
        const today = new Date().toISOString().split('T')[0];
        const todayLogs = appData.logs.filter(l => l.date.startsWith(today));
        
        if (todayLogs.length === 0) return alert("今天还没做题呢，先做两道再让AI夸你！");

        const problemList = todayLogs.map(l => {
            return `- ${l.name} (${RATINGS[l.ratingVal].label})`;
        }).join('\n');

        const prompt = `
我今天练习了算法，做了以下 ${todayLogs.length} 道题目：
${problemList}

我的目前等级是 LV.${appData.level}。
请帮我复盘今天的学习情况：
1. 用幽默且带有鼓励性的语气评价我的表现。
2. 根据题目难度分布，给出接下来的简短学习建议。
3. 如果我看起来在“虐菜”或者“受虐”，请狠狠地点醒我。
4. 结尾给我一句扎心的激励语。
`.trim();

        navigator.clipboard.writeText(prompt).then(() => {
            alert("🤖 提示词已复制！\n请打开 DeepSeek / ChatGPT，粘贴发送即可获得你的专属日报！");
        });
    }

    function copyReport() {
        const today = new Date().toISOString().split('T')[0];
        const todayLogs = appData.logs.filter(l => l.date.startsWith(today));
        if(todayLogs.length === 0) return alert("今天无记录");
        
        const listText = todayLogs.map(l => {
            const linkText = l.sol ? l.sol : '暂无链接';
            return `✅ ${l.name}\n🔗 ${linkText}`;
        }).join('\n\n');
        
        const text = `📅 ${today} 算法打卡\n🏆 AC: ${todayLogs.length}\n--------------------\n${listText}\n--------------------\n"${document.getElementById('qContent').innerText}"`;
        navigator.clipboard.writeText(text).then(() => alert("极简战报已复制！"));
    }

    function renderUI() {
        document.getElementById('lvNum').innerText = appData.level;
        document.getElementById('curXP').innerText = appData.xp;
        const nextXP = 50 * Math.pow(appData.level, 2);
        document.getElementById('nextXP').innerText = nextXP;
        const prevXP = 50 * Math.pow(appData.level - 1, 2);
        const pct = ((appData.xp - prevXP) / (nextXP - prevXP)) * 100;
        document.getElementById('xpFill').style.width = `${Math.max(0, Math.min(pct, 100))}%`;
        document.getElementById('totalAC').innerText = appData.logs.length;
        
        // 渲染分段统计
        const stats = { "1200":0, "1500":0, "1750":0, "2000":0, "2200":0 };
        appData.logs.forEach(l => { if(stats[l.ratingVal] !== undefined) stats[l.ratingVal]++; });
        
        const statHTML = Object.keys(RATINGS).map(k => {
            const r = RATINGS[k];
            if(stats[k] === 0) return ''; // 没数据的段不显示，节省空间
            return `
                <div class="rs-row">
                    <span class="rs-label"><div class="dot" style="background:${r.color}"></div> ${r.label}</span>
                    <span style="font-weight:bold;">${stats[k]}</span>
                </div>
            `;
        }).join('');
        document.getElementById('ratingStatsBox').innerHTML = statHTML || '<div style="color:#ccc;text-align:center;font-size:0.8rem">暂无数据</div>';

        // Todos
        const todoBox = document.getElementById('todoList');
        todoBox.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];
        const showTodos = appData.todos.filter(t => !t.done || t.date === today);
        if (showTodos.length === 0) todoBox.innerHTML = '<div style="color:#999;font-size:0.8rem">今日任务已清空</div>';
        showTodos.forEach(t => {
            const div = document.createElement('div');
            div.className = `todo-item ${t.done ? 'done' : ''}`;
            div.innerHTML = `<span>${t.text}</span>${!t.done ? `<button class="btn-submit" style="padding:4px 8px;font-size:0.75rem" onclick="setPendingTodo('${t.text}')">提交</button>` : '<span>✔️</span>'}`;
            todoBox.appendChild(div);
        });

        // Logs
        const logBox = document.getElementById('logList');
        logBox.innerHTML = '';
        appData.logs.slice(0, 30).forEach(l => {
            const conf = RATINGS[l.ratingVal];
            const div = document.createElement('div');
            div.className = 'log-card';
            div.style.borderLeftColor = conf.color;
            div.innerHTML = `
                <div>
                    <div style="font-weight:bold; display:flex; align-items:center;">
                        <span class="rating-tag" style="background:${conf.color}">${conf.label}</span> ${l.name}
                    </div>
                    <div style="font-size:0.8rem; color:#888; margin-top:5px;">${l.date.split('T')[0]} · +${l.xp} XP</div>
                </div>
                <div class="link-group">
                    ${l.link ? `<a href="${l.link}" target="_blank" class="link-prob">原题</a>` : ''}
                    ${l.sol ? `<a href="${l.sol}" target="_blank" class="link-sol">我的代码</a>` : '<span style="font-size:0.8rem;color:#ccc;margin-left:10px;">无代码</span>'}
                </div>
            `;
            logBox.appendChild(div);
        });

        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth();
        document.getElementById('calTitle').innerText = `${y}年 ${m+1}月`;
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m+1, 0).getDate();
        
        const stats = {};
        appData.logs.forEach(l => { stats[l.date.split('T')[0]] = 'active'; });
        appData.logs.forEach(l => { if (parseInt(l.ratingVal) >= 2000) stats[l.date.split('T')[0]] = 'gold'; });
        
        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
        let streak = 0; const todayStr = now.toISOString().split('T')[0];
        for(let d=1; d<=daysInMonth; d++) {
            const dayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.className = `cal-cell ${stats[dayStr] || ''}`;
            if (dayStr === todayStr) cell.classList.add('today');
            cell.innerText = d; grid.appendChild(cell);
            if (new Date(dayStr) <= now && stats[dayStr]) streak++;
            else if (new Date(dayStr) < now && !stats[dayStr]) streak = 0;
        }
        document.getElementById('streakDays').innerText = streak;
    }
</script>
</body>
</html>
