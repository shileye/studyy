<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code & Sorrow // 算法日记</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff;
            --primary: #4f46e5; --accent: #db2777;
            --text-main: #334155; --text-light: #64748b;
            --shadow: 0 4px 20px -5px rgba(0,0,0,0.1);
            --gold: #f59e0b;
            --border: #e2e8f0;
        }

        /* 暗黑模式变量 */
        body.dark {
            --bg: #0f172a; --card: #1e293b;
            --primary: #818cf8; --accent: #f472b6;
            --text-main: #f1f5f9; --text-light: #94a3b8;
            --shadow: 0 4px 20px -5px rgba(0,0,0,0.5);
            --border: #334155;
        }

        * { box-sizing: border-box; outline: none; transition: background 0.3s, color 0.3s, border 0.3s; }

        body {
            margin: 0; padding: 40px 20px;
            background: var(--bg); color: var(--text-main);
            font-family: 'Noto Serif SC', serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 1200px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 25px;
            grid-template-areas: "quote quote" "sidebar main";
            position: relative;
        }

        /* 顶部开关 */
        .theme-switch {
            position: absolute; top: -30px; right: 0; cursor: pointer;
            font-size: 1.2rem; opacity: 0.7;
        }
        .theme-switch:hover { opacity: 1; transform: scale(1.1); }

        /* 顶部语录 */
        .quote-box {
            grid-area: quote;
            background: var(--card); padding: 35px;
            border-radius: 12px; box-shadow: var(--shadow);
            text-align: center; position: relative;
            border-left: 5px solid var(--primary); overflow: hidden;
        }
        .quote-content { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; min-height: 2rem; }
        .quote-author { color: var(--accent); font-style: italic; font-size: 0.9rem; }
        .timer-bar {
            position: absolute; bottom: 0; left: 0; height: 3px; background: var(--primary);
            width: 0%; animation: timeFlow 30s linear infinite;
        }
        @keyframes timeFlow { from {width: 0%} to {width: 100%} }

        /* 左侧面板 */
        .sidebar { grid-area: sidebar; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid transparent; }
        body.dark .card { border-color: var(--border); }

        .user-header { text-align: center; margin-bottom: 15px; }
        .rank-badge {
            background: rgba(79, 70, 229, 0.1); color: var(--primary);
            padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace; border: 1px solid var(--primary);
        }
        
        /* 经验条 */
        .xp-container { margin: 10px 0; }
        .xp-info { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        .xp-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .xp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; }

        /* 勋章墙 (新功能) */
        .badge-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 15px;
            background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px;
        }
        .badge {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.2rem; opacity: 0.2; filter: grayscale(100%); transition: 0.3s;
            cursor: help; position: relative;
        }
        .badge.unlocked { opacity: 1; filter: grayscale(0%); transform: scale(1.1); }
        .badge:hover::after {
            content: attr(data-title); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            background: #000; color: #fff; font-size: 0.6rem; padding: 4px 8px; border-radius: 4px;
            white-space: nowrap; z-index: 10; pointer-events: none;
        }

        /* 传送门 */
        .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .q-link {
            text-decoration: none; background: var(--border); color: var(--text-main);
            padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85rem;
            font-weight: bold; font-family: sans-serif; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .q-link:hover { background: var(--border); color: var(--primary); transform: translateY(-2px); border: 1px solid var(--primary);}

        /* 统计与日历 */
        .rating-stats { margin-top: 20px; border-top: 1px dashed var(--border); padding-top: 15px; }
        .rs-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; font-family: 'JetBrains Mono', monospace;}
        .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px;}

        .btn-group { display: grid; gap: 8px; margin-top: 15px; }
        .btn { border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: bold; color:white; }
        .btn-ai { background: linear-gradient(135deg, #6366f1, #a855f7); }
        .btn-share { background: var(--text-main); }
        .btn-share:hover, .btn-ai:hover { opacity: 0.9; transform: scale(0.98); }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
        .cal-cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; font-size: 0.75rem; background: var(--border); color: var(--text-light);
            font-family: 'JetBrains Mono', monospace;
        }
        .cal-cell.today { border: 2px solid var(--primary); color: var(--primary); font-weight: bold; }
        .cal-cell.active { background: var(--primary); color: white; }
        .cal-cell.gold { background: var(--gold); color: white; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }

        /* 主内容 */
        .main { grid-area: main; display: flex; flex-direction: column; gap: 20px; }
        
        .todo-section { border: 2px dashed var(--border); }
        .todo-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--bg); border-radius: 8px; margin-bottom: 8px;
        }
        .todo-item.done { text-decoration: line-through; opacity: 0.5; }

        .input-box { display: grid; gap: 12px; }
        .row { display: flex; gap: 10px; }
        input, select {
            padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; width: 100%;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .btn-submit { background: var(--primary); color: white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;}

        .log-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: var(--card); border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); border-left: 4px solid #ccc;
            border: 1px solid var(--border); border-left-width: 4px;
        }
        .rating-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            padding: 2px 6px; border-radius: 4px; margin-right: 8px; color: white;
        }
        .link-group a { text-decoration: none; font-size: 0.85rem; margin-left: 15px; font-family: 'Noto Sans SC', sans-serif; }
        .link-prob { color: var(--text-light); } .link-prob:hover { text-decoration: underline; }
        .link-sol { color: var(--primary); font-weight: bold; } .link-sol:hover { text-decoration: underline; }

        .footer-msg {
            margin: 40px 0 20px 0; text-align: center; color: var(--text-light);
            font-size: 0.9rem; letter-spacing: 1px; font-family: 'Noto Serif SC', serif;
            grid-column: 1 / -1;
        }

        /* 彩带特效容器 */
        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; grid-template-areas: "quote" "sidebar" "main"; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <div class="theme-switch" onclick="toggleTheme()">🌓</div>

    <!-- 1. 语录区 -->
    <div class="quote-box">
        <div class="quote-content" id="qContent">...</div>
        <div class="quote-author" id="qAuthor"></div>
        <div class="timer-bar"></div>
    </div>

    <!-- 2. 左侧状态 -->
    <div class="sidebar">
        <div class="card">
            <div class="user-header">
                <h2 style="margin:5px 0" id="username">Algo_Warrior</h2>
                <div class="rank-badge" id="lvTitle">Unrated</div>
            </div>
            
            <div class="xp-container">
                <div class="xp-info">
                    <span>LV.<span id="lvNum">1</span></span>
                    <span><span id="curXP">0</span> / <span id="nextXP">100</span> XP</span>
                </div>
                <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
            </div>

            <!-- 勋章墙 -->
            <div class="badge-grid" id="badgeGrid">
                <!-- JS生成 -->
            </div>

            <div style="text-align:center; margin-top:15px; font-size:0.9rem;">
                <span style="margin-right:15px;">🏆 AC: <b id="totalAC">0</b></span>
                <span>🔥 连打: <b id="streakDays" style="color:var(--accent)">0</b></span>
            </div>

            <div class="rating-stats" id="ratingStatsBox"></div>

            <div class="quick-links">
                <a href="https://i.cnblogs.com/posts/edit" target="_blank" class="q-link" style="background:rgba(219, 39, 119, 0.1); color:#db2777;">📝 写博客</a>
                <a href="https://codeforces.com/" target="_blank" class="q-link">📊 CF</a>
                <a href="https://ac.nowcoder.com/acm/contest/vip-index" target="_blank" class="q-link">🐂 牛客</a>
                <a href="https://atcoder.jp/" target="_blank" class="q-link">🇯🇵 ABC</a>
            </div>

            <div class="btn-group">
                <button class="btn btn-ai" onclick="generateAIPrompt()">🤖 复制 AI 复盘提示词</button>
                <button class="btn btn-share" onclick="copyReport()">📋 复制 PRO 战报</button>
            </div>
        </div>

        <div class="card">
            <div style="font-weight:bold; margin-bottom:10px;" id="calTitle"></div>
            <div class="calendar-grid" id="calGrid"></div>
        </div>
    </div>

    <!-- 3. 主操作区 -->
    <div class="main">
        <div class="card todo-section">
            <h3 style="margin:0; color:var(--primary);">📜 每日必修 (Daily Quest)</h3>
            <div class="row" style="margin-top:15px;">
                <input type="text" id="todoInput" placeholder="输入任务 (e.g. 补题 CF 1900C)">
                <button class="btn-submit" style="width:auto;" onclick="addTodo()">添加</button>
            </div>
            <div class="todo-list" id="todoList"></div>
        </div>

        <div class="card input-box" id="submitZone">
            <h3 style="margin:0;">⚔️ 提交代码 (Commit)</h3>
            <div class="row">
                <select id="ratingSelect" style="flex:1;">
                    <option value="1200">Rating < 1400 (新手)</option>
                    <option value="1500">1400 ~ 1600 (普及)</option>
                    <option value="1750">1600 ~ 1900 (提高)</option>
                    <option value="2000">1900 ~ 2100 (大师)</option>
                    <option value="2200">Rating 2100+ (传奇)</option>
                </select>
                <input type="text" id="probName" placeholder="题目名称" style="flex:2;">
            </div>
            <div class="row">
                <input type="text" id="probLink" placeholder="原题链接">
                <input type="text" id="solLink" placeholder="我的代码/博客链接 (战报必备)">
            </div>
            <button class="btn-submit" onclick="submitAC()">✅ 确认 AC (发射彩带!)</button>
        </div>

        <h3 style="margin:0;">🗓️ 时光轨迹</h3>
        <div class="log-list" id="logList"></div>
    </div>

    <div class="footer-msg">你要考虑这是不是你此生仅有的机会</div>
</div>

<script>
    const DB_KEY = "algo_v6_badges";
    
    // 配置库
    const QUOTES = [
        {t:"十年生死两茫茫，不思量，自难忘。", a:"苏轼"}, {t:"欲买桂花同载酒，终不似，少年游。", a:"刘过"},
        {t:"人生若只如初见，何事秋风悲画扇。", a:"纳兰性德"}, {t:"代码写得再好，也 catch 不到你抛出的异常。", a:"Anon"},
        {t:"我们都在阴沟里，但仍有人仰望星空。", a:"王尔德"}, {t:"简单的事情重复做，你就是专家。", a:"刻意练习"},
        {t:"你想要的生活，都在你现在的努力里。", a:"加油"}, {t:"菜是原罪，练是救赎。", a:"小羊肖恩"},
        {t:"Talk is cheap. Show me the code.", a:"Linus"}, {t:"人生如逆旅，我亦是行人。", a:"苏轼"},
        {t:"未雨绸缪，是程序员的顶级浪漫。", a:"架构"}, {t:"为了看一眼山顶的风景，我愿意流干汗水。", a:"攀登者"}
    ];

    const RATINGS = {
        "1200": { color: "#9ca3af", label: "< 1400", xp: 10 },
        "1500": { color: "#2dd4bf", label: "1400-1600", xp: 25 },
        "1750": { color: "#3b82f6", label: "1600-1900", xp: 45 },
        "2000": { color: "#a855f7", label: "1900-2100", xp: 70 },
        "2200": { color: "#ef4444", label: "2100+", xp: 100 }
    };

    // 勋章配置
    const BADGES = [
        { id: "b1", icon: "🌱", title: "初出茅庐", check: (d) => d.logs.length >= 1 },
        { id: "b2", icon: "🔥", title: "持之以恒", check: (d) => getStreak(d) >= 3 },
        { id: "b3", icon: "🦁", title: "毅力帝", check: (d) => getStreak(d) >= 7 },
        { id: "b4", icon: "⚡", title: "肝帝", check: (d) => getTodayCount(d) >= 5 },
        { id: "b5", icon: "⚔️", title: "挑战者", check: (d) => d.maxRating >= 1600 },
        { id: "b6", icon: "👑", title: "大师", check: (d) => d.maxRating >= 1900 },
        { id: "b7", icon: "👽", title: "传说", check: (d) => d.maxRating >= 2100 },
        { id: "b8", icon: "💯", title: "百题斩", check: (d) => d.logs.length >= 100 }
    ];

    let appData = { xp: 0, level: 1, maxRating: 0, todos: [], logs: [] };
    let quoteIdx = 0;

    /* --- 初始化 --- */
    window.onload = () => {
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        loadData();
        renderUI();
        updateQuote();
        setInterval(() => { quoteIdx = (quoteIdx + 1) % QUOTES.length; updateQuote(); }, 30000);
    };

    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    function updateQuote() {
        const q = QUOTES[quoteIdx];
        const elC = document.getElementById('qContent'), elA = document.getElementById('qAuthor');
        elC.style.opacity = 0; elA.style.opacity = 0;
        setTimeout(() => { elC.innerText = q.t; elA.innerText = `—— ${q.a}`; elC.style.opacity = 1; elA.style.opacity = 1; }, 300);
    }

    /* --- 数据逻辑 --- */
    function loadData() {
        const saved = localStorage.getItem(DB_KEY);
        if (saved) appData = JSON.parse(saved);
        else {
            const old = localStorage.getItem("algo_v5_pro");
            if(old) appData = JSON.parse(old);
        }
    }
    function saveData() { localStorage.setItem(DB_KEY, JSON.stringify(appData)); renderUI(); }

    function getStreak(d) {
        // 简化版连胜计算
        let streak = 0;
        const now = new Date();
        // 实际逻辑太复杂，这里简单处理：如果有今天或昨天的记录，就+1，否则归零
        // 为了演示效果，这里使用 calGrid 计算的逻辑
        return parseInt(document.getElementById('streakDays')?.innerText || 0); 
    }
    function getTodayCount(d) {
        const today = new Date().toISOString().split('T')[0];
        return d.logs.filter(l => l.date.startsWith(today)).length;
    }

    function addTodo() {
        const val = document.getElementById('todoInput').value;
        if (!val) return;
        appData.todos.push({ id: Date.now(), text: val, date: new Date().toISOString().split('T')[0], done: false });
        document.getElementById('todoInput').value = '';
        saveData();
    }
    
    function setPendingTodo(text) {
        document.getElementById('probName').value = text;
        document.getElementById('submitZone').scrollIntoView({ behavior: 'smooth' });
        document.getElementById('probName').focus();
    }

    function submitAC() {
        const name = document.getElementById('probName').value;
        if (!name) return alert("题目名称必填");
        const rVal = document.getElementById('ratingSelect').value;
        const config = RATINGS[rVal];
        
        // 更新MaxRating
        if(rVal==="2200") appData.maxRating=Math.max(appData.maxRating,2200);
        else if(rVal==="2000") appData.maxRating=Math.max(appData.maxRating,2000);
        else if(rVal==="1750") appData.maxRating=Math.max(appData.maxRating,1750);
        else if(rVal==="1500") appData.maxRating=Math.max(appData.maxRating,1500);

        const match = appData.todos.find(t => t.text === name && !t.done);
        if (match) match.done = true;

        appData.logs.unshift({
            id: Date.now(), date: new Date().toISOString(),
            name, ratingVal: rVal,
            link: document.getElementById('probLink').value,
            sol: document.getElementById('solLink').value,
            xp: config.xp
        });
        appData.xp += config.xp;
        
        const nextLv = Math.floor(Math.sqrt(appData.xp / 50)) + 1;
        if (nextLv > appData.level) { appData.level = nextLv; alert(`🎉 升级了！LV.${appData.level}`); }

        document.getElementById('probName').value = '';
        document.getElementById('probLink').value = '';
        document.getElementById('solLink').value = '';
        
        saveData();
        fireConfetti(); // 触发彩带
    }

    /* --- 增强功能 --- */
    function generateAIPrompt() {
        const today = new Date().toISOString().split('T')[0];
        const todayLogs = appData.logs.filter(l => l.date.startsWith(today));
        if (todayLogs.length === 0) return alert("今天还没做题呢！");

        const problemList = todayLogs.map(l => `- ${l.name} (${RATINGS[l.ratingVal].label})`).join('\n');
        const prompt = `我今天练习了算法，做了以下 ${todayLogs.length} 道题目：\n${problemList}\n\n我的目前等级是 LV.${appData.level}。请帮我复盘今天的学习情况：\n1. 用幽默鼓励的语气评价。\n2. 给出接下来的学习建议。\n3. 如果我虐菜或受虐，请点醒我。\n4. 结尾给一句扎心的激励语。`;
        
        navigator.clipboard.writeText(prompt).then(() => alert("🤖 AI 提示词已复制！"));
    }

    function copyReport() {
        const today = new Date().toISOString().split('T')[0];
        const todayLogs = appData.logs.filter(l => l.date.startsWith(today));
        if(todayLogs.length === 0) return alert("今天无记录");

        // 统计分段
        let stats = {};
        todayLogs.forEach(l => {
            const label = RATINGS[l.ratingVal].label;
            stats[label] = (stats[label] || 0) + 1;
        });
        const statStr = Object.entries(stats).map(([k,v]) => `${k} x${v}`).join(' | ');

        // 生成列表
        const listText = todayLogs.map(l => {
            const label = RATINGS[l.ratingVal].label;
            const linkText = l.sol ? l.sol : '暂无链接';
            return `✅ [${label}] ${l.name}\n🔗 ${linkText}`;
        }).join('\n\n');

        const text = `
📅 ${today} 算法打卡
🔥 总计: ${todayLogs.length}题
📊 分布: ${statStr}
--------------------
${listText}
--------------------
"${document.getElementById('qContent').innerText}"
(Generated by AlgoDiary)
`.trim();
        navigator.clipboard.writeText(text).then(() => alert("📊 详细战报已复制！包含分段统计！"));
    }

    /* --- 渲染逻辑 --- */
    function renderUI() {
        document.getElementById('lvNum').innerText = appData.level;
        document.getElementById('curXP').innerText = appData.xp;
        const nextXP = 50 * Math.pow(appData.level, 2);
        document.getElementById('nextXP').innerText = nextXP;
        const prevXP = 50 * Math.pow(appData.level - 1, 2);
        const pct = ((appData.xp - prevXP) / (nextXP - prevXP)) * 100;
        document.getElementById('xpFill').style.width = `${Math.max(0, Math.min(pct, 100))}%`;
        document.getElementById('totalAC').innerText = appData.logs.length;

        // 渲染勋章
        const badgeBox = document.getElementById('badgeGrid');
        badgeBox.innerHTML = '';
        BADGES.forEach(b => {
            const unlocked = b.check(appData);
            badgeBox.innerHTML += `<div class="badge ${unlocked?'unlocked':''}" data-title="${b.title}">${b.icon}</div>`;
        });

        // 统计
        const stats = { "1200":0, "1500":0, "1750":0, "2000":0, "2200":0 };
        appData.logs.forEach(l => { if(stats[l.ratingVal]!==undefined) stats[l.ratingVal]++; });
        const statHTML = Object.keys(RATINGS).map(k => {
            if(stats[k]===0) return '';
            return `<div class="rs-row"><span style="display:flex;align-items:center"><div class="dot" style="background:${RATINGS[k].color}"></div>${RATINGS[k].label}</span><b>${stats[k]}</b></div>`;
        }).join('');
        document.getElementById('ratingStatsBox').innerHTML = statHTML;

        // Logs
        const logBox = document.getElementById('logList');
        logBox.innerHTML = '';
        appData.logs.slice(0, 30).forEach(l => {
            const conf = RATINGS[l.ratingVal];
            const div = document.createElement('div');
            div.className = 'log-card';
            div.style.borderLeftColor = conf.color;
            div.innerHTML = `
                <div>
                    <div style="font-weight:bold;display:flex;align-items:center;flex-wrap:wrap;">
                        <span class="rating-tag" style="background:${conf.color}">${conf.label}</span>${l.name}
                    </div>
                    <div style="font-size:0.8rem;color:var(--text-light);margin-top:5px;">${l.date.split('T')[0]} · +${l.xp} XP</div>
                </div>
                <div class="link-group">
                    ${l.link ? `<a href="${l.link}" target="_blank" class="link-prob">原题</a>` : ''}
                    ${l.sol ? `<a href="${l.sol}" target="_blank" class="link-sol">代码</a>` : ''}
                </div>
            `;
            logBox.appendChild(div);
        });
        
        // Todos & Calendar (省略部分重复逻辑，复用即可)
        renderTodosAndCal();
    }

    function renderTodosAndCal() {
        const todoBox = document.getElementById('todoList');
        todoBox.innerHTML = '';
        const today = new Date().toISOString().split('T')[0];
        const showTodos = appData.todos.filter(t => !t.done || t.date === today);
        if(showTodos.length===0) todoBox.innerHTML='<div style="color:#999;font-size:0.8rem">今日任务已清空</div>';
        showTodos.forEach(t => {
            todoBox.innerHTML += `<div class="todo-item ${t.done?'done':''}"><span style="font-size:0.9rem">${t.text}</span>${!t.done?`<button class="btn btn-ai" style="padding:4px 8px;font-size:0.75rem" onclick="setPendingTodo('${t.text}')">提交</button>`:'<span>✔️</span>'}</div>`;
        });

        const grid = document.getElementById('calGrid');
        grid.innerHTML = '';
        const now = new Date();
        const y = now.getFullYear(); const m = now.getMonth();
        document.getElementById('calTitle').innerText = `${y}年 ${m+1}月`;
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m+1, 0).getDate();
        
        const stats = {};
        appData.logs.forEach(l => { stats[l.date.split('T')[0]] = 'active'; });
        appData.logs.forEach(l => { if (parseInt(l.ratingVal) >= 2000) stats[l.date.split('T')[0]] = 'gold'; });

        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
        let streak = 0; const todayStr = now.toISOString().split('T')[0];
        for(let d=1; d<=daysInMonth; d++) {
            const dayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cell = document.createElement('div');
            cell.className = `cal-cell ${stats[dayStr] || ''}`;
            if (dayStr === todayStr) cell.classList.add('today');
            cell.innerText = d; grid.appendChild(cell);
            if (new Date(dayStr) <= now && stats[dayStr]) streak++;
            else if (new Date(dayStr) < now && !stats[dayStr]) streak = 0;
        }
        document.getElementById('streakDays').innerText = streak;
    }

    // 彩带特效 (无需外部库)
    function fireConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let particles = [];
        const colors = ['#4f46e5', '#db2777', '#f59e0b', '#10b981', '#3b82f6'];
        
        for(let i=0; i<100; i++) {
            particles.push({
                x: window.innerWidth / 2, y: window.innerHeight / 2,
                vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10 - 5,
                color: colors[Math.floor(Math.random()*colors.length)],
                size: Math.random() * 5 + 2, life: 100
            });
        }
        
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
                if(p.life <= 0) particles.splice(index, 1);
            });
            if(particles.length > 0) requestAnimationFrame(animate);
        }
        animate();
    }
</script>
